name: Build cumulative Starling Mods ARM64 APK

on:
  push:
    branches:
      - feat/starling-mods-combined-alpha1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout both native ports
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Starling revision
        uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: 09fa16c167c4b2f8eb23fddd0faa808d56d0a2f2
          path: upstream/starling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          rustup default 1.95.0
      - name: Check both source bundles and run all local behavior tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          cargo test --manifest-path tests/rust/greedymeshing-core/Cargo.toml
          cargo test --manifest-path tests/rust/lightmap-cache/Cargo.toml
          cargo test --manifest-path tests/rust/fov-fastpath/Cargo.toml
          test "$(git -C upstream/starling rev-parse HEAD)" = "09fa16c167c4b2f8eb23fddd0faa808d56d0a2f2"
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          revision = "09fa16c167c4b2f8eb23fddd0faa808d56d0a2f2"
          mixins = "ddd9700b21997c95d95ac6ee5ecafe3830cf622a"
          for mod_id in ("badoptimizations", "greedymeshing"):
              root = Path("mods") / mod_id / "native"
              meta = json.loads((root / "horizon-native.json").read_text())
              spec = tomllib.loads((root / "mixins" / mod_id / "horizon-mixin.toml").read_text())
              assert meta["id"] == mod_id and meta["game"] == "26.3"
              assert meta["horizon"] == revision and meta["mixins"] == mixins
              assert meta["version"] == spec["mod"]["version"]
              assert spec["compatibility"]["horizon_revision"] == revision
          assert Path("mods/greedymeshing/core.rs").read_bytes() == Path(
              "mods/greedymeshing/native/mixins/greedymeshing/core.rs"
          ).read_bytes()
          PY
          mkdir -p build-output
          python3 tools/package_hnmod.py mods/badoptimizations/native             --output build-output/badoptimizations-0.1.0-alpha.2.hnmod
          python3 tools/package_hnmod.py mods/greedymeshing/native             --output build-output/greedymeshing-0.1.0-alpha.2.hnmod
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Prepare optional swap for native linker
        run: |
          set -e
          where=/mnt
          avail=$(df --output=avail -BG "$where" | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 12 ]; then
            where="$RUNNER_TEMP"
            avail=$(df --output=avail -BG "$where" | tail -1 | tr -dc 0-9)
          fi
          if [ "$avail" -ge 12 ]; then
            sudo fallocate -l 8G "$where/mods-build.swap"
            sudo chmod 600 "$where/mods-build.swap"
            sudo mkswap "$where/mods-build.swap" >/dev/null
            sudo swapon "$where/mods-build.swap" || true
          fi
      - name: Compile both mods in one native Android library
        env:
          ABI: arm64-v8a
          PROFILE: quick
          VARIANT: --dev
          NATIVE_LIBRARY_ONLY: '1'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export NATIVE_CACHE="$RUNNER_TEMP/starling-native-cache"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash upstream/starling/packaging/android/native_build.sh             "$GITHUB_WORKSPACE/upstream/starling"             "$GITHUB_WORKSPACE/build-output"             "$GITHUB_WORKSPACE/mods/badoptimizations/native/mixins/badoptimizations"             "$GITHUB_WORKSPACE/mods/greedymeshing/native/mixins/greedymeshing"             2>&1 | tee "$GITHUB_WORKSPACE/mods-build.log"
      - name: Package separate Starling Mods app
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/starling-native-cache/build-arm64-v8a"
          python3 tools/patch_mods_variant.py "$build"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          (cd "$build" && python3 packaging/android/build_apk.py --abi arm64-v8a             --profile quick --no-build --dev) 2>&1 | tee -a "$GITHUB_WORKSPACE/mods-build.log"
          cp "$build/target/android/starling-dev-0.8.0-arm64-v8a.apk"             build-output/starling-dev-0.8.0-arm64-v8a.apk
      - name: Verify both mods, exact native checksum, and app identity
        run: |
          set -euo pipefail
          apk=build-output/starling-dev-0.8.0-arm64-v8a.apk
          python3 tools/verify_mods_apk.py             --manifest build-output/build.json             --library build-output/libhorizon_android.so             --apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$apk"             | grep -Fx 'io.github.juanluci.starling.mods'
      - name: Upload combined APK and exact source archives
        uses: actions/upload-artifact@v4
        with:
          name: starling-mods-combined-alpha1-arm64
          path: |
            build-output/starling-dev-0.8.0-arm64-v8a.apk
            build-output/build.json
            build-output/badoptimizations-0.1.0-alpha.2.hnmod
            build-output/greedymeshing-0.1.0-alpha.2.hnmod
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starling-mods-combined-diagnostics
          path: |
            mods-build.log
            build-output/build.json
          retention-days: 7
          if-no-files-found: ignore
