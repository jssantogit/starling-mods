[mod]
id = "exycraft"
version = "0.1.0-alpha.1"
priority = 200

[compatibility]
horizon_revision = "09fa16c167c4b2f8eb23fddd0faa808d56d0a2f2"

# Starling already calls diagnostic_context() at recording start and once
# per performance sample. Keep the recorder, UI, and ZIP exporter unchanged.
[[module]]
id = "probe"
file = "crates/horizon-client/src/game.rs"
name = "exycraft_probe"
source = "probe.rs"

[[injection]]
id = "enrich-stock-diagnostic-context"
kind = "RETURN"
target = "horizon_client::game::diagnostics::Game<'_>::diagnostic_context"
helper = "after.rs"
bindings = [
  { name = "result", ty = "serde_json::Value", value = "$value" },
  { name = "game", ty = "&Game<'_>", value = "&*self" },
]
